# SPIKE: config an independently published plugin would ship.
#
# `external_packages` maps the CORE namespace (`iroh_ffi`) to the Python module path of
# the separately installed `iroh` package, so the generated bindings emit
# `from iroh.iroh_ffi import Endpoint, _UniffiConverterTypeEndpoint`.

[bindings.python]
cdylib_name = "iroh_ffi_ping"

[bindings.python.external_packages]
iroh_ffi = "iroh.iroh_ffi"

[bindings.kotlin]
package_name = "computer.iroh.ping"
cdylib_name = "iroh_ffi_ping"

# Keyed by CRATE name (`[lib] name`), not package name. Kotlin auto-fills this in library
# mode, but only correctly when each crate's own uniffi.toml is discovered — do NOT pass
# `--config`, which overrides the config for every crate at once.
[bindings.kotlin.external_packages]
iroh_ffi = "computer.iroh"
