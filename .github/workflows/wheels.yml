name: Python Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  manylinux:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        name: [ubuntu-latest, ubuntu-arm-latest]
        include:
          - name: ubuntu-latest
            release-os: manylinux_2_28
            release-arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
            runner: [self-hosted, linux, X64]
          - name: ubuntu-arm-latest
            release-os: manylinux_2_28
            release-arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
            runner: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      - name: Install rust + cargo-make
        run: |
          curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source $HOME/.cargo/env
          cargo install cargo-make
      - name: Install maturin & uniffi-bindgen
        run: /opt/python/cp311-cp311/bin/pip install -U maturin uniffi-bindgen
      - name: cargo make python-wheel-manylinux
        run: |
          source $HOME/.cargo/env
          export PATH=/opt/python/cp311-cp311/bin:$PATH
          cargo make python-wheel-manylinux
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.release-os }}-${{ matrix.release-arch }}
          path: target/wheels/*.whl
          # Consumed by the `publish` job in the same run. 3 days leaves margin
          # to re-run a failed publish without holding ~3GB for 90 days.
          retention-days: 3

  musllinux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - release-arch: x86_64
            container-image: quay.io/pypa/musllinux_1_2_x86_64
            runner: [self-hosted, linux, X64]
          - release-arch: aarch64
            container-image: quay.io/pypa/musllinux_1_2_aarch64
            runner: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      # Run the script in docker since the host is glibc
      - name: Build musllinux wheel
        run: docker run --rm -v "$PWD:/build" -w /build ${{ matrix.container-image }} /build/build_wheel.sh musllinux
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux_1_2-${{ matrix.release-arch }}
          path: target/wheels/*.whl
          retention-days: 3

  osx:
    # arm64-only: the org has no GitHub-hosted macOS and x86_64 mac wheels
    # were dropped.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -U maturin uniffi-bindgen
      - name: maturin build
        run: maturin build --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-darwin-aarch64
          path: target/wheels/*.whl
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: davidB/rust-cargo-make@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -U maturin uniffi-bindgen
      - name: cargo make python-wheel
        run: cargo make python-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: target/wheels/*.whl
          retention-days: 3

  verify-musl-wheel:
    name: Smoke-test musllinux wheel (${{ matrix.release-arch }})
    needs: musllinux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release-arch: x86_64
            runner: [self-hosted, linux, X64]
            platform: linux/amd64
          - release-arch: aarch64
            runner: [self-hosted, linux, ARM64]
            platform: linux/arm64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-musllinux_1_2-${{ matrix.release-arch }}
          path: dist/
      - name: Install wheel + exercise native API in Alpine Linux
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/dist:/dist" -w /dist python:3.11-alpine sh -ec '
            pip install --quiet ./iroh-*-musllinux_1_2_*.whl
            python -c "import iroh; s = iroh.SecretKey.generate(); assert len(s.public().to_bytes()) == 32; print(\"musllinux wheel smoke: OK\", s.public().fmt_short())"
          '

  publish:
    name: Publish wheels to PyPI
    needs: [manylinux, osx, windows, musllinux, verify-musl-wheel]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, X64]
    # Trusted Publishing (OIDC) — no long-lived PyPI token needed. Requires
    # the publisher to be registered once at
    # https://pypi.org/manage/account/publishing/ (project: iroh,
    # owner: n0-computer, repo: iroh-ffi, workflow: wheels.yml).
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
